name: Build Cross-Platform Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Create Streamlit Launcher
        shell: python
        run: |
          import os
          content = """
          import streamlit.web.cli as stcli
          import os, sys

          def resolve_path(path):
              # Handle both PyInstaller and Nuitka paths
              if hasattr(sys, '_MEIPASS'):
                  return os.path.join(sys._MEIPASS, path)
              return os.path.join(os.path.dirname(os.path.abspath(__file__)), path)

          if __name__ == "__main__":
              print("--------------------------------------------------")
              print("🚀 AI-Powered Google Maps Lead Generator")
              print("--------------------------------------------------")
              print("📦 Initializing system... (May take a moment)")
              print("🌐 Starting web server...")
              
              sys.argv = [
                  "streamlit",
                  "run",
                  resolve_path("app.py"),
                  "--global.developmentMode=false",
              ]
              sys.exit(stcli.main())
          """
          with open("launcher.py", "w", encoding="utf-8") as f:
              f.write(content.strip())

      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: launcher.py
          onefile: true
          standalone: true
          include-package: streamlit,langchain_openai,playwright,html2text,openpyxl,pandas
          include-data-files: |
            app.py=app.py
            .env.example=.env.example
          include-data-dir: src=src
          output-file: GoogleMapsLeadGenerator-windows.exe
          output-dir: dist
          clean-cache: all

      - name: Build executable (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --onedir --additional-hooks-dir=. --collect-all streamlit --collect-all langchain_openai --collect-all playwright --collect-all html2text --collect-all openpyxl --collect-all pandas --add-data "app.py:." --add-data "src:src" --add-data ".env.example:." --name GoogleMapsLeadGenerator --clean launcher.py

      - name: Create ZIP archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd dist && zip -r ../GoogleMapsLeadGenerator-${{ matrix.os }}.zip GoogleMapsLeadGenerator

      - name: List files for debugging
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse | Select-Object FullName

      - name: Upload Release Assets (Windows)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest'
        with:
          files: dist/GoogleMapsLeadGenerator-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets (Unix)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows-latest'
        with:
          files: GoogleMapsLeadGenerator-${{ matrix.os }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

